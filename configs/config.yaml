# =====================================================================
# Biceps Brachii Ultrasound Segmentation Configuration
# Target Data Source: Probefix - Sebastian (Full Array 128 Scanlines, L12-5N40-A4)
# =====================================================================

project:
  name: "Biceps_Brachii_US_Segmentation"
  version: "2.0.0"
  device: "cuda"  # "cuda" or "cpu"

data:
  raw_base_dir: "../../Probefix - Sebastian"
  subjects:
    - "Azmi_-_RM_10"
    - "Tissa_-_10RM"
  
  image_dir: "../dataset/images"
  mask_dir: "../dataset/masks"
  calibration_file: "../dataset/spatial_calibration.csv"
  
  # Image parameters (Full Aperture: 38.4 mm width x 89.96 mm depth)
  # Isotropically scaled unit slice: Height = 512 px, Width = 219 px
  image_height: 512
  image_width: 224        # Divisible by 32 for UNet architectures
  in_channels: 1          # Grayscale B-mode
  num_classes: 1          # Binary segmentation (Biceps Brachii)
  
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  random_seed: 42

augmentation:
  horizontal_flip_prob: 0.5
  random_brightness_contrast_prob: 0.3
  shift_scale_rotate_prob: 0.4
  gaussian_noise_prob: 0.2

model:
  architecture: "Unet"
  encoder_name: "resnet34"
  encoder_weights: "imagenet"
  in_channels: 1
  classes: 1
  activation: "sigmoid"

training:
  batch_size: 8
  num_workers: 2
  epochs: 50
  lr: 0.0001
  weight_decay: 0.00001
  scheduler: "CosineAnnealingLR"
  min_lr: 0.000001
  loss_type: "dice_bce"
  early_stopping_patience: 10
  save_dir: "./weights"

inference:
  checkpoint_path: "./weights/best_model.pth"
  threshold: 0.5
  output_dir: "./outputs"
  save_visualizations: true
  calculate_muscle_thickness: true
  pixel_spacing_mm: 0.1757 # 1 px = 0.1757 mm (Depth = 89.96 mm / 512 px)
